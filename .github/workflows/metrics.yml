name: Metrics

on:
  # Refresh daily
  schedule: [{cron: "17 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Re-render when this workflow changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

# Only one render at a time, never overlapping commits
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the rendered SVGs back to this repo
    steps:
      # 1) Profile overview: activity, community, public repositories
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HackX-IN
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: metrics-overview.svg

      # 2) Most used languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HackX-IN
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          filename: metrics-languages.svg

      # 3) Isometric contribution calendar (full year)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HackX-IN
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics-calendar.svg
